# R, the packages of the pipeline, and CmdStan (cached)
name: setup
description: R, the packages of the pipeline and CmdStan
runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"hard"'
        packages: |
          any::targets
          any::dplyr
          any::tidyr
          any::tibble
          any::ggplot2
          any::posterior
          any::withr
          github::stan-dev/cmdstanr
    - uses: actions/cache@v4
      with:
        path: ~/.cmdstan
        key: cmdstan-${{ runner.os }}-${{ env.ImageOS }}-1
    - name: Install CmdStan
      shell: bash
      run: Rscript -e 'if(is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) cmdstanr::install_cmdstan(cores = 4)'
