# The checks of the derivations in the appendices of the paper (checks/):
# each SymPy script prints PASS or FAIL for each check and fails the run if
# any check fails. A push which changes checks/ runs them. The Mathematica
# notebook checks/checks.nb holds the same checks, to be run by hand.

name: checks

on:
  workflow_dispatch:
  push:
    paths:
      - checks/**
      - .github/workflows/checks.yml

permissions:
  contents: read

jobs:
  sympy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy==1.14.0
      - name: Run the checks
        working-directory: checks
        run: |
          status=0
          for f in partition_prior.py triggered_report.py; do
            echo "== $f"
            python "$f" || status=1
          done
          exit $status
